<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Checkers</title>
<style>
  body { font-family: system-ui, sans-serif; background: #222; color: #eee; display: flex; flex-direction: column; align-items: center; }
  #board { display: grid; grid-template-columns: repeat(8, min(11vw, 64px)); grid-template-rows: repeat(8, min(11vw, 64px)); border: 4px solid #654; }
  .sq { display: flex; align-items: center; justify-content: center; }
  .light { background: #eed8b0; } .dark { background: #8b5a2b; }
  .target { box-shadow: inset 0 0 0 4px #4f4; cursor: pointer; }
  .piece { width: 78%; height: 78%; border-radius: 50%; box-shadow: 0 3px 4px #0008; display: flex; align-items: center; justify-content: center; font-size: 1.6em; }
  .piece.r { background: #c22; } .piece.b { background: #111; color: #fc0; } .piece.r { color: #fc0; }
  .piece.movable { cursor: pointer; outline: 3px solid #ff0; }
  .piece.selected { outline: 3px solid #4f4; }
  button, input { font-size: 1em; padding: 6px 10px; }
  #status { margin: 10px; font-size: 1.2em; min-height: 1.4em; }
</style>
</head>
<body>
<h1>Online Checkers</h1>
<div id="lobby">
  <input id="roomInput" placeholder="Room code (blank = new)">
  <button id="joinBtn">Join / Create</button>
</div>
<div id="info"></div>
<div id="status"></div>
<div id="board"></div>
<button id="restartBtn" style="display:none;margin-top:10px">Play again</button>
<script src="client.js"></script>
</body>
</html>
